catalogMode: prefer

catalog:
  "@types/node": ^24
  "@vitest/coverage-v8": 4.1.10
  "@xterm/headless": ^6.0.0
  # 1.1.0 ships a non-executable macOS spawn-helper; build 1.0.0 from source.
  node-pty: 1.0.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
  vitest: 4.1.10
  zod: ^4.6.7

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  node-pty: true
